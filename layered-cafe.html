<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>暖阳分层咖啡馆原型</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              dusk: '#15120f',
              amber: '#e7a756',
              paper: '#f4ead8',
            },
          },
        },
      };
    </script>
    <style>
      body {
        background:
          radial-gradient(circle at 50% 12%, rgba(231, 167, 86, 0.2), transparent 28rem),
          linear-gradient(180deg, #2a201b 0%, #15120f 100%);
      }

      .glass {
        border: 1px solid rgba(244, 234, 216, 0.16);
        background: rgba(20, 16, 13, 0.72);
        box-shadow: 0 22px 80px rgba(0, 0, 0, 0.34);
        backdrop-filter: blur(18px);
      }

      .scene {
        position: relative;
        width: min(100%, 1120px);
        aspect-ratio: 16 / 9;
        margin: 0 auto;
        overflow: hidden;
        border-radius: 8px;
        background: #17130f;
      }

      .layer {
        position: absolute;
        pointer-events: none;
        user-select: none;
      }

      .room-bg {
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .table-layer {
        left: 35.5%;
        top: 45.5%;
        width: 31%;
        transform: translate(-50%, -50%) rotate(-1deg);
        filter: drop-shadow(0 18px 18px rgba(0, 0, 0, 0.32));
      }

      .avatar-layer {
        left: 32.4%;
        top: 53.8%;
        width: 14.5%;
        transform: translate(-50%, -50%);
        filter: drop-shadow(0 12px 11px rgba(0, 0, 0, 0.34));
      }

      .table-front-mask {
        left: 37.2%;
        top: 51.2%;
        width: 23.5%;
        height: 8.4%;
        transform: translate(-50%, -50%) skewX(-28deg) rotate(1deg);
        border-radius: 5px;
        background:
          linear-gradient(180deg, rgba(167, 105, 49, 0.96), rgba(87, 53, 30, 0.98)),
          linear-gradient(90deg, transparent, rgba(255, 218, 137, 0.24), transparent);
        box-shadow:
          inset 0 3px 0 rgba(244, 200, 121, 0.22),
          0 10px 16px rgba(0, 0, 0, 0.22);
      }

      .sunbeam {
        left: 8%;
        top: 4%;
        width: 56%;
        height: 92%;
        transform: skewX(-18deg);
        background: linear-gradient(90deg, transparent, rgba(255, 209, 122, 0.16), transparent);
        mix-blend-mode: screen;
      }

      .dust {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      .dust i {
        position: absolute;
        width: 3px;
        height: 3px;
        border-radius: 999px;
        background: rgba(255, 219, 151, 0.78);
        animation: floatDust 8s linear infinite;
      }

      @keyframes floatDust {
        from {
          transform: translate3d(-8px, 12px, 0);
          opacity: 0;
        }
        20% {
          opacity: 0.75;
        }
        80% {
          opacity: 0.55;
        }
        to {
          transform: translate3d(34px, -26px, 0);
          opacity: 0;
        }
      }
    </style>
  </head>
  <body class="min-h-screen text-paper antialiased">
    <main class="mx-auto flex min-h-screen max-w-6xl flex-col gap-4 px-4 py-4">
      <section class="glass rounded-lg p-2">
        <div class="scene">
          <img class="layer room-bg" src="assets/layered-room-bg-v1.png" alt="暖阳咖啡馆背景" />
          <div class="layer sunbeam"></div>
          <img class="layer table-layer" src="assets/layered-table-chair-v1.png" alt="咖啡馆桌椅" />
          <img id="avatar" class="layer avatar-layer hidden" src="assets/layered-avatar-v1.png" alt="坐姿 Avatar" />
          <div id="table-mask" class="layer table-front-mask hidden"></div>
          <div class="dust" aria-hidden="true">
            <i style="left: 22%; top: 36%; animation-delay: -0.2s"></i>
            <i style="left: 34%; top: 28%; animation-delay: -1.4s"></i>
            <i style="left: 43%; top: 52%; animation-delay: -2.2s"></i>
            <i style="left: 56%; top: 42%; animation-delay: -3.8s"></i>
            <i style="left: 66%; top: 30%; animation-delay: -5.1s"></i>
            <i style="left: 78%; top: 48%; animation-delay: -6.4s"></i>
          </div>
          <div class="pointer-events-none absolute left-5 top-5">
            <p class="text-xs uppercase tracking-[0.28em] text-amber/75">layered prototype</p>
            <h1 class="mt-2 text-2xl font-semibold">暖阳分层咖啡馆</h1>
          </div>
        </div>
      </section>

      <section class="glass grid gap-3 rounded-lg p-4 md:grid-cols-[1fr_auto_auto] md:items-end">
        <label class="block">
          <span class="text-xs uppercase tracking-[0.22em] text-paper/50">nickname</span>
          <input
            id="nickname"
            maxlength="12"
            placeholder="今晚坐一会儿"
            class="mt-2 w-full rounded-md border border-paper/10 bg-dusk/70 px-3 py-2 text-sm outline-none ring-amber/30 transition focus:ring-2"
          />
        </label>
        <button
          id="sit-button"
          class="rounded-md bg-amber px-5 py-2 text-sm font-semibold text-dusk transition hover:bg-[#f0bd72]"
        >
          坐下
        </button>
        <button
          id="leave-button"
          class="rounded-md border border-paper/15 px-5 py-2 text-sm text-paper/70 transition hover:border-paper/30 hover:text-paper"
        >
          起身
        </button>
        <p id="status" class="text-sm text-paper/60 md:col-span-3">
          新原型：背景、桌椅、Avatar、桌前缘遮挡、光效分层渲染。
        </p>
      </section>
    </main>

    <script>
      const $ = (selector) => document.querySelector(selector);

      function updateStatus(seated) {
        const name = $('#nickname').value.trim() || '无名自习者';
        $('#avatar').classList.toggle('hidden', !seated);
        $('#table-mask').classList.toggle('hidden', !seated);
        $('#status').textContent = seated
          ? `${name} 已坐下：桌前缘遮挡 Avatar，下半身进入桌下空间。`
          : '新原型：背景、桌椅、Avatar、桌前缘遮挡、光效分层渲染。';
      }

      $('#sit-button').addEventListener('click', () => updateStatus(true));
      $('#leave-button').addEventListener('click', () => updateStatus(false));
      $('#nickname').addEventListener('input', () => {
        if (!$('#avatar').classList.contains('hidden')) updateStatus(true);
      });
    </script>
  </body>
</html>
